name: update-banks

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-banks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Refresh bank directory
        run: python3 tools/update_banks.py

      - name: Test generator
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- app/src/main/java/vn/io/elsutm/mbqr/vietqr/BankDirectory.kt; then
            echo "Bank directory is unchanged."
            exit 0
          fi

          branch="chore/update-banks"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add app/src/main/java/vn/io/elsutm/mbqr/vietqr/BankDirectory.kt
          git commit -m "chore(banks): refresh the vietqr bank directory"
          git push --force origin "$branch"

          if [ "$(gh pr list --head "$branch" --state open --json number --jq 'length')" = "0" ]; then
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$branch" \
              --title "chore(banks): refresh the vietqr bank directory" \
              --body "Refresh \`BankDirectory.kt\` from https://api.vietqr.io/v2/banks. Generated by \`tools/update_banks.py\`."
          else
            echo "Updated the existing pull request."
          fi
