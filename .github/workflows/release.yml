name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Create a GitHub release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('smoke-{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install SDK platform
        run: |
          if command -v android >/dev/null 2>&1; then
            android sdk install platforms/android-37.0 build-tools/37.0.0
          else
            sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Collect artifacts
        run: |
          cp app/build/outputs/apk/release/app-release.apk "mbqr-${VERSION_NAME}-arm64-v8a.apk"
          sha256sum mbqr-*.apk > SHA256SUMS

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mbqr-${{ env.VERSION_NAME }}
          path: |
            mbqr-*.apk
            SHA256SUMS

      - name: Publish release
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION_NAME }}
          files: |
            mbqr-*.apk
            SHA256SUMS
